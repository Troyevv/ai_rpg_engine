name: E2E runner
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      artifact-prefix:
        type: string
        required: true
permissions:
  contents: read
jobs:
  shard:
    name: ${{ inputs.artifact-prefix }} (${{ matrix.project }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2]
    env:
      CI: 'true'
      E2E_SHARD: ${{ inputs.artifact-prefix }}-${{ matrix.project }}-${{ matrix.shard }}
      # Each job has a separate VM/network namespace, including legacy 8013/8014 servers.
      E2E_PORT: '8011'
      E2E_OUTPUT: test-results
      E2E_SUMMARY: test-results/ci-summary.json
    steps:
      - name: Allocate shard database
        run: echo "E2E_DB_PATH=$RUNNER_TEMP/e2e-$E2E_SHARD.sqlite3" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.full }}
        with:
          name: e2e-plan
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run selected E2E
        if: ${{ !inputs.full }}
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        working-directory: frontend
        env:
          E2E_PLAN: ../e2e-plan.json
      - name: Run full E2E
        if: ${{ inputs.full }}
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        id: report
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
          if-no-files-found: error
      - name: Link report
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: echo "[HTML, JUnit, traces and results]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
