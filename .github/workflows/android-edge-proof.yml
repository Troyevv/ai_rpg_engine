name: Android menu perimeter proof
on:
  push:
    branches: [feat/274-interface-skins]
    paths: [.github/workflows/android-edge-proof.yml]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-menu-perimeter
          path: /tmp/android-proof
          run-id: 44941674273
          github-token: ${{ github.token }}
      - run: python -m pip install --user --break-system-packages pillow
      - name: Export comparison for the pull request
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import base64
          root=Path('/tmp/android-proof')
          sheet=Image.new('RGB',(1312,1505),'#1c2025')
          d=ImageDraw.Draw(sheet)
          font=lambda n:ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',n)
          d.text((12,8),(root/'browser').read_text().strip()+' на Android 14 · полноэкранное меню',font=font(32),fill='white')
          for col,version in enumerate(('before','after')):
           for row,state in enumerate(('top','bottom')):
            x=col*656+9;y=row*724+61
            name=('До исправления' if col==0 else 'После исправления')+' · '+('начало меню' if row==0 else 'после прокрутки')
            d.text((x,y),name,font=font(22),fill='white')
            raw=Image.open(root/(version+'-'+state+'-device.png')).convert('RGB')
            raw.thumbnail((321,676))
            sheet.paste(raw,(x,y+31))
            web=Image.open(root/(version+'-'+state+'-web.png')).convert('RGB')
            for label,box,dy in [('Верхний край',(0,0,108,32),95),('Левый край',(0,220,108,252),221),('Правый край',(web.width-108,220,web.width,252),347),('Нижний край',(web.width-108,web.height-32,web.width,web.height),473)]:
             d.text((x+329,y+dy),label,font=font(17),fill='#ddd')
             sheet.paste(web.crop(box).resize((302,90),Image.Resampling.NEAREST),(x+329,y+dy+24))
          path=root/'android-menu-edges.webp';sheet.save(path,quality=91,method=6)
          data=base64.b64encode(path.read_bytes()).decode()
          for i in range(0,len(data),1200):
              print('ANDROID_IMAGE_DATA ' + str(i//1200) + ' ' + data[i:i+1200])
          PY
